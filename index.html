<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郵便番号住所検索</title>
  <style>
    :root {
      --bg: #f4f7f8;
      --ink: #15212a;
      --muted: #62717d;
      --line: #d8e1e6;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --accent-soft: #dff5f1;
      --danger: #b42318;
      --warning-bg: #fff5dd;
      --shadow: 0 22px 70px rgba(21, 33, 42, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 8% 12%, rgba(15, 118, 110, 0.12), transparent 32rem),
        linear-gradient(145deg, #f8fbfc 0%, #edf4f6 50%, #f9fbfb 100%);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.6;
      background: transparent;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 0;
      display: grid;
      align-content: center;
      gap: 28px;
    }

    .header {
      display: grid;
      gap: 10px;
    }

    .badge {
      width: fit-content;
      padding: 6px 10px;
      border: 1px solid rgba(15, 118, 110, 0.22);
      border-radius: 999px;
      color: var(--accent-dark);
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.82rem;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .lead {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.14rem);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.62fr);
      gap: 18px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid rgba(216, 225, 230, 0.9);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .search-panel {
      padding: clamp(20px, 3.6vw, 34px);
      display: grid;
      gap: 22px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    label {
      color: #31424f;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input {
      width: 100%;
      min-height: 58px;
      padding: 0 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #ffffff;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0;
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
    }

    button {
      min-height: 58px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: var(--accent);
      font-weight: 900;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: progress;
      opacity: 0.72;
    }

    .helper {
      margin: 0;
      color: var(--muted);
      font-size: 0.93rem;
    }

    .status {
      min-height: 28px;
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .status[data-type="error"] {
      color: var(--danger);
    }

    .status[data-type="success"] {
      color: var(--accent-dark);
    }

    .result {
      display: grid;
      gap: 14px;
    }

    .address-card {
      padding: clamp(18px, 3vw, 26px);
      border: 1px solid rgba(15, 118, 110, 0.18);
      border-radius: 8px;
      background: linear-gradient(180deg, #ffffff 0%, #f2fbf9 100%);
    }

    .address-card[hidden] {
      display: none;
    }

    .zip-label {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font-size: 0.92rem;
      font-weight: 900;
    }

    .address {
      display: grid;
      gap: 8px;
    }

    .address span {
      display: block;
      overflow-wrap: anywhere;
      letter-spacing: 0;
      line-height: 1.18;
    }

    .prefecture {
      font-size: clamp(2.15rem, 7vw, 4.7rem);
      font-weight: 950;
    }

    .city {
      font-size: clamp(1.55rem, 4.2vw, 3rem);
      font-weight: 900;
    }

    .town {
      color: #263844;
      font-size: clamp(1.3rem, 3.3vw, 2.25rem);
      font-weight: 850;
    }

    .meta-panel {
      padding: clamp(18px, 3vw, 28px);
      display: grid;
      align-content: start;
      gap: 18px;
    }

    .meta-block {
      display: grid;
      gap: 6px;
    }

    .meta-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 900;
    }

    .meta-text {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .sample-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sample-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(15, 118, 110, 0.22);
      color: var(--accent-dark);
      background: var(--accent-soft);
      font-size: 0.9rem;
      font-weight: 850;
    }

    .sample-button:hover {
      color: #ffffff;
      background: var(--accent);
    }

    .notice {
      padding: 14px;
      border-radius: 8px;
      color: #6d4b00;
      background: var(--warning-bg);
      font-size: 0.9rem;
      font-weight: 700;
    }

    @media (max-width: 780px) {
      .app {
        width: min(100% - 24px, 620px);
        padding: 28px 0;
        align-content: start;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }

    @media (max-width: 420px) {
      .app {
        width: min(100% - 20px, 620px);
      }

      .search-panel,
      .meta-panel {
        padding: 18px;
      }

      input {
        min-height: 54px;
        font-size: 1.08rem;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="badge">ZipCloud API</div>
      <h1>郵便番号から住所を検索</h1>
      <p class="lead">7桁の郵便番号を入力すると、都道府県・市区町村・町域をすぐに表示します。</p>
    </header>

    <section class="shell" aria-label="郵便番号検索">
      <div class="panel search-panel">
        <form class="form" id="search-form">
          <label for="zipcode">郵便番号</label>
          <div class="input-row">
            <input id="zipcode" name="zipcode" type="text" inputmode="numeric" autocomplete="postal-code" placeholder="例: 760-0001" maxlength="8" required>
            <button id="search-button" type="submit">検索</button>
          </div>
          <p class="helper">ハイフンあり・なしのどちらでも検索できます。</p>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <section class="address-card" id="result-card" aria-label="検索結果" hidden>
          <p class="zip-label" id="result-zip"></p>
          <div class="address">
            <span class="prefecture" id="prefecture"></span>
            <span class="city" id="city"></span>
            <span class="town" id="town"></span>
          </div>
        </section>
      </div>

      <aside class="panel meta-panel" aria-label="補助情報">
        <div class="meta-block">
          <p class="meta-title">入力例</p>
          <p class="meta-text">サンプルを押すとすぐ検索できます。</p>
        </div>
        <ul class="sample-list">
          <li><button class="sample-button" type="button" data-zip="7600001">7600001</button></li>
          <li><button class="sample-button" type="button" data-zip="100-0001">100-0001</button></li>
          <li><button class="sample-button" type="button" data-zip="0600000">0600000</button></li>
        </ul>
        <div class="notice">見つからない郵便番号や未入力のときは、ここではなく検索エリアにメッセージを表示します。</div>
      </aside>
    </section>
  </main>

  <script>
    const form = document.getElementById("search-form");
    const input = document.getElementById("zipcode");
    const button = document.getElementById("search-button");
    const statusText = document.getElementById("status");
    const resultCard = document.getElementById("result-card");
    const resultZip = document.getElementById("result-zip");
    const prefecture = document.getElementById("prefecture");
    const city = document.getElementById("city");
    const town = document.getElementById("town");
    const sampleButtons = document.querySelectorAll(".sample-button");

    function normalizeZipcode(value) {
      return value.replace(/[^\d]/g, "");
    }

    function formatZipcode(value) {
      const normalized = normalizeZipcode(value);
      return normalized.length === 7
        ? `${normalized.slice(0, 3)}-${normalized.slice(3)}`
        : value;
    }

    function setStatus(message, type = "") {
      statusText.textContent = message;
      statusText.dataset.type = type;
    }

    function clearResult() {
      resultCard.hidden = true;
      resultZip.textContent = "";
      prefecture.textContent = "";
      city.textContent = "";
      town.textContent = "";
    }

    function renderAddress(zipcode, address) {
      resultZip.textContent = `〒${formatZipcode(zipcode)}`;
      prefecture.textContent = address.address1;
      city.textContent = address.address2;
      town.textContent = address.address3;
      resultCard.hidden = false;
    }

    async function searchAddress(rawZipcode) {
      const zipcode = normalizeZipcode(rawZipcode);

      clearResult();

      if (zipcode.length !== 7) {
        setStatus("7桁の郵便番号を入力してください。", "error");
        input.focus();
        return;
      }

      button.disabled = true;
      setStatus("検索しています...");

      try {
        const endpoint = `https://zipcloud.ibsnet.co.jp/api/search?zipcode=${encodeURIComponent(zipcode)}`;
        const response = await fetch(endpoint);

        if (!response.ok) {
          throw new Error("network");
        }

        const data = await response.json();

        if (data.status !== 200) {
          setStatus(data.message || "検索できませんでした。時間をおいて再度お試しください。", "error");
          return;
        }

        if (!data.results || data.results.length === 0) {
          setStatus("該当する住所が見つかりませんでした。", "error");
          return;
        }

        renderAddress(zipcode, data.results[0]);
        setStatus("住所が見つかりました。", "success");
      } catch (error) {
        setStatus("通信に失敗しました。ネットワーク接続を確認してください。", "error");
      } finally {
        button.disabled = false;
      }
    }

    input.addEventListener("input", () => {
      const digits = normalizeZipcode(input.value).slice(0, 7);
      input.value = digits.length > 3 ? `${digits.slice(0, 3)}-${digits.slice(3)}` : digits;
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      searchAddress(input.value);
    });

    sampleButtons.forEach((sampleButton) => {
      sampleButton.addEventListener("click", () => {
        input.value = formatZipcode(sampleButton.dataset.zip);
        searchAddress(input.value);
      });
    });
  </script>
</body>
</html>
